<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPM - Central de Notas - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-notification" class="toast-notification">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Login realizado com sucesso!</span>
    </div>

    <main class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <div class="logo-area">
                    <h1 class="brand-title">OPM</h1>
                    <span class="badge-v1">V1</span>
                </div>
                <h2 class="brand-subtitle">CENTRAL DE NOTAS</h2>
            </div>

            <div class="login-tabs">
                <button type="button" class="tab-item active">
                    <i class="fa-solid fa-file-invoice"></i> workcreate
                </button>
            </div>

            <form id="loginForm" onsubmit="realizarLogin(event)">
                <div class="form-group">
                    <label for="inputUsuario">
                        <i class="fa-solid fa-envelope"></i> E-mail de Acesso
                    </label>
                    <input type="email" id="inputUsuario" placeholder="Digite seu e-mail..." required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="inputSenha">
                        <i class="fa-solid fa-lock"></i> Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="inputSenha" placeholder="Digite sua senha..." required autocomplete="current-password">
                        <i class="fa-solid fa-eye-slash toggle-password" id="togglePasswordIcon" onclick="alternarVisibilidadeSenha()"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit-login" id="btnLoginSubmit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar no Sistema
                </button>
            </form>

            <div class="login-footer-info">
                Operator Machine &copy; 2026
            </div>

        </div>
    </main>

    <!-- FIREBASE AUTHENTICATION SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSlCybvi9IUeRMj_yjOs4OqDrR5WVJa9U",
            authDomain: "workcreate-189ac.firebaseapp.com",
            projectId: "workcreate-189ac",
            storageBucket: "workcreate-189ac.firebasestorage.app",
            messagingSenderId: "889763696082",
            appId: "1:889763696082:web:847882f4930ee67bf24c0b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.firebaseAuthLogin = async function(email, senha) {
            try {
                await signInWithEmailAndPassword(auth, email, senha);
                mostrarNotificacaoToast("Acesso autorizado! Redirecionando...");
                setTimeout(() => {
                    window.location.href = "workcreate.html";
                }, 1000);
            } catch (error) {
                console.error(error);
                let erroMsg = "Erro ao fazer login.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    erroMsg = "E-mail ou senha inválidos.";
                } else if (error.code === 'auth/too-many-requests') {
                    erroMsg = "Muitas tentativas. Tente mais tarde.";
                }
                alert(erroMsg);
                const btn = document.getElementById('btnLoginSubmit');
                if (btn) btn.disabled = false;
            }
        };
    </script>
    <script src="script.js"></script>
</body>
</html>
